name: CI

on:
  push:
    branches:
      - master
      - kmp
    tags:
      - v*
  pull_request:


jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "The ${{ github.repository }} repository has been cloned."
      - run: echo "Setting up JDK"

      - name: Setup
        uses: ./.github/actions/workflow_setup

      - run: echo "Run unit tests"
      - name: Test
        run: ./gradlew test

      - name: Static Analysis
        run: ./gradlew lintKotlin detektAll

      - run: echo "Assembling production and benchmark outputs"
      - name: Assemble
        run: >
          ./gradlew
          :app:assembleLiveDebug
          :app:assembleLiveRelease
          :baselineprofile:assembleFixtureBenchmarkRelease
      - run: echo "Build status report=${{ job.status }}."

      - run: echo "Uploading build artifacts"
      - name: Upload a Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: app-live-release
          path: app/build/outputs/apk/live/release/app-live-release.apk

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/workflow_setup

      # iosApp needs the iOS 26 SDK; the image's default Xcode may be older than its newest one.
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Xcode: $xcode"
          sudo xcode-select -s "$xcode"

      # The newest iOS runtime's first iPhone (runtimes sorted by version, not as strings).
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("\\.iOS-")) | {v: (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)), d: .value}] | sort_by(.v) | reverse | [.[].d[] | select(.name | startswith("iPhone"))][0].udid // empty')
          [ -n "$udid" ] || { echo "No available iPhone simulator"; exit 1; }
          echo "Simulator: $udid"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      - name: Kotlin tests on iOS
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 iosSimulatorArm64Test -PiosSimulatorDevice="$SIMULATOR"

      - name: Build and test iosApp
        run: >
          xcodebuild test
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -destination "id=$SIMULATOR"
          CODE_SIGNING_ALLOWED=NO
